version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: nova_english_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nova_english
    ports:
      - '5432:5432'
    volumes:
      - nova_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nova_pg_data:
